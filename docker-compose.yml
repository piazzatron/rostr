# Local rostr API: `docker compose up`. See server/README.md for running the tests against this Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rostr
      POSTGRES_PASSWORD: rostr
      POSTGRES_DB: rostr
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostr -d rostr"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://rostr:rostr@postgres:5432/rostr?sslmode=disable
      PORT: "8080"
      # End-to-end tests register many owners from one IP
      RATE_LIMIT_REGISTRATIONS_PER_HOUR: "10000"
      RATE_LIMIT_REQUESTS_PER_MINUTE: "100000"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
