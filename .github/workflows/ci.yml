name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            tests/go.sum
      - name: golangci-lint (vet, staticcheck, gofmt, goimports, ...)
        run: make lint
      - name: govulncheck
        run: make vuln

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Presets match site/src/data/rosters.ts
        run: go test -count=1 -run TestPresetsMatchSite -v ./internal/presets/gen/
      - name: go test
        run: go test -race ./...

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rostr
          POSTGRES_PASSWORD: rostr
          POSTGRES_DB: rostr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostr -d rostr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://rostr:rostr@localhost:5432/rostr?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go test
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: |
            cli/go.sum
            tests/go.sum
      - name: End-to-end tests (Docker Compose stack, real CLI)
        run: tests/run.sh
