name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            tests/go.sum
      - name: golangci-lint (vet, staticcheck, gofmt, goimports, ...)
        run: make lint
      - name: govulncheck
        run: make vuln

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Presets match site/src/data/rosters.ts
        run: go test -count=1 -run TestPresetsMatchSite -v ./internal/presets/gen/
      - name: go test
        run: go test -race ./...

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rostr
          POSTGRES_PASSWORD: rostr
          POSTGRES_DB: rostr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostr -d rostr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://rostr:rostr@localhost:5432/rostr?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go test
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull Postgres while Go is set up and the server image is built; the job's end cleans up the process
      - name: Pull Postgres in the background
        run: (docker pull -q postgres:17-alpine >/dev/null 2>&1 &)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: |
            cli/go.sum
            tests/go.sum
      # The server image, with its layers cached across runs, so a change that leaves server/ alone skips the Go build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          tags: rostr-e2e-server
          cache-from: type=gha,scope=e2e-server
          cache-to: type=gha,scope=e2e-server,mode=max
      - name: End-to-end tests (Docker Compose stack, real CLI)
        run: tests/run.sh
        env:
          ROSTR_E2E_PREBUILT: "1"
