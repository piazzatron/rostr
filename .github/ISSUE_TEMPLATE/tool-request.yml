name: Tool request
description: Ask for rostr to work with another agent, app, or terminal
title: "Tool request: "
labels: ["tool-request"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The coding agent, app, terminal, or multiplexer.
      placeholder: Zellij
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where the name should show
      description: The title, sidebar, tab, or status line you'd want rostr to name.
