name: Roster submission
description: Suggest a roster for the presets
title: "Roster submission: "
labels: ["roster-submission"]
body:
  - type: input
    id: name
    attributes:
      label: Roster name
      placeholder: The Fellowship
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where it's from
      description: The book, show, team, or field the members come from.
      placeholder: The Lord of the Rings
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: Members
      description: One per line, each with an emoji, the best-known first. A team of six takes the first six.
      placeholder: |
        🧙 Gandalf
        💍 Frodo
        🌱 Samwise
        👑 Aragorn
        🏹 Legolas
        🪓 Gimli
        🛡️ Boromir
        🍺 Merry
        🍄 Pippin
    validations:
      required: true
